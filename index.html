function computePonders(parsed, recordMV) {
  const ponders = {};
  ponders.p0 = {
    value: parsed.hasTopCompetition ? 1 : 0,
    valid: true,
    label: "Top Competition",
    detail: parsed.topCompetitionDetail
  };
  if (parsed.playerValueM != null) {
    ponders.p1 = {
      value: clamp(parsed.playerValueM / recordMV, 0, 1),
      valid: true,
      label: "Player Value",
      detail: `€${parsed.playerValueM}M / €${recordMV}M`
    };
  } else ponders.p1 = {
    valid: false,
    label: "Player Value",
    detail: "no player value found on the page"
  };
  {
    const arr = parsed.monthlyRatings.slice(0, 12);
    const denom = Math.max(arr.length, 7);
    const sum = arr.reduce((a, b) => a + b, 0);
    const avg = sum / denom;
    ponders.p2 = {
      value: clamp(avg / 10, 0, 1),
      valid: true,
      label: "Rating Trend (12mo)",
      n: arr.length,
      detail: arr.length < 7 ? `${sum.toFixed(1)}/${denom} (padded with ${denom - arr.length} zeros, only ${arr.length} real ratings)` : `${avg.toFixed(2)}/10`
    };
  }
  if (parsed.attrOverview) {
    const vals = Object.values(parsed.attrOverview);
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    ponders.p3 = {
      value: clamp(avg / 100, 0, 1),
      valid: true,
      label: "Attribute Overview",
      detail: `${avg.toFixed(1)}/100 (${Object.entries(parsed.attrOverview).map(([k, v]) => `${k} ${v}`).join(", ")})`
    };
  } else ponders.p3 = {
    valid: false,
    label: "Attribute Overview",
    detail: "no Attribute Overview section found on the page"
  };

  // Recent Results: only matches from the last 12 months, most recent first, capped at 10
  const now = new Date();
  const oneYearAgo = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 365);
  const recentMatches = parsed.matches.filter(m => m.date && m.date >= oneYearAgo).slice(0, 10);
  {
    const wins = recentMatches.filter(m => m.result === "W").length;
    const draws = recentMatches.filter(m => m.result === "D").length;
    const losses = recentMatches.length - wins - draws;
    const denomMatches = Math.max(recentMatches.length, 6);
    const pts = 3 * wins + draws;
    ponders.p6 = {
      value: clamp(pts / (3 * denomMatches), 0, 1),
      valid: true,
      label: "Recent Results (last 10, past 12mo)",
      n: recentMatches.length,
      wins,
      draws,
      detail: recentMatches.length < 6 ? `${wins}W-${draws}D-${losses}L, ${pts}/${denomMatches * 3} pts (padded with ${denomMatches - recentMatches.length} zero matches)` : `${wins}W-${draws}D-${losses}L (${pts}/${recentMatches.length * 3} pts)`
    };
